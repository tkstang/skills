name: Deploy Docs

# Builds the Fumadocs docs app (documentation/) as a static export and publishes
# it to GitHub Pages. Modeled on open-agent-toolkit's deploy-docs.yml, adapted
# for this repo's nested-standalone shape (the docs app has its own lockfile and
# is built with `cd documentation && pnpm build`, not a root workspace script).
#
# Prerequisite (one-time, operator): enable GitHub Pages with
# Settings -> Pages -> Source: "GitHub Actions".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'documentation/**'
      - '.github/workflows/deploy-docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent Pages deployment; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy docs to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: documentation/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: documentation
        run: pnpm install --frozen-lockfile

      - name: Build docs (static export -> documentation/out)
        working-directory: documentation
        run: pnpm build
        env:
          # GitHub Pages project site serves under https://<owner>.github.io/skills/.
          # If this repo later uses a custom domain at the apex, drop this so the
          # site builds at the root path instead.
          NEXT_PUBLIC_BASE_PATH: /skills

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: documentation/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
