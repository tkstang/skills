name: Docs CI

# PR-time gate for the Fumadocs docs app (documentation/). Runs the OAT docs
# checker, mirrors the build recipe from deploy-docs.yml (install + build),
# verifies the committed generated manifest is fresh, and runs the docs format
# check, minus the GitHub Pages configure/upload/deploy steps — this job only
# checks the docs site before merge, it does not publish.

on:
  pull_request:
    paths:
      - 'documentation/**'
      - '.oat/config.json'
      - '.github/workflows/docs-ci.yml'

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Check, build, and format-check docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history lets the checker compare diagrams against origin/main.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: documentation/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: documentation
        run: pnpm install --frozen-lockfile

      - name: Put the docs app's OAT CLI on PATH
        run: echo "$GITHUB_WORKSPACE/documentation/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check docs
        run: oat docs check --target-dir documentation

      - name: Build docs (static export -> documentation/out)
        working-directory: documentation
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /skills

      - name: Check the generated manifest is fresh
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- documentation/index.md
          oat docs generate-index --docs-dir documentation/docs --output documentation/index.md
          git diff --exit-code -- documentation/index.md

      - name: Check docs formatting
        working-directory: documentation
        run: pnpm run docs:format:check
