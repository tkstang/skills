name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches:
      - main

permissions:
  contents: read

# Ready PR replacements share a group. Drafts and ignored edits stay isolated
# from pending checks; ignored edits also use separate check names.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
    github.event_name == 'pull_request' &&
    (github.event.pull_request.draft ||
    (github.event.action == 'edited' && !github.event.changes.base.ref)) &&
    format('-ignored-{0}', github.run_id) ||
    ''
    }}
  cancel-in-progress: >-
    ${{
    github.event_name != 'pull_request' ||
    (!github.event.pull_request.draft &&
    (github.event.action != 'edited' || github.event.changes.base.ref != null))
    }}

jobs:
  validate:
    name: >-
      ${{
      github.event.action == 'edited' &&
      !github.event.changes.base.ref &&
      'Ignored PR edit (validate)' ||
      'validate'
      }}
    if: >-
      github.event_name == 'push' ||
      (!github.event.pull_request.draft &&
       (github.event.action != 'edited' || github.event.changes.base.ref))
    runs-on: ubuntu-latest
    env:
      GIT_HOOKS: "0" # skip git-hook setup in CI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture generated output paths
        run: pnpm tsx scripts/build-generated.ts --list-outputs > "$RUNNER_TEMP/generated-output-paths.txt"
      - name: Verify committed generated outputs before tests
        run: pnpm run build:check
      - run: pnpm run type-check
      - run: pnpm run test
      - run: pnpm run validate
      - run: pnpm run smoke

  static:
    name: >-
      ${{
      github.event.action == 'edited' &&
      !github.event.changes.base.ref &&
      'Ignored PR edit (static)' ||
      'static'
      }}
    # PR policies share setup; keep individual checks visible after a failure.
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      (github.event.action != 'edited' || github.event.changes.base.ref)
    env:
      GIT_HOOKS: "0"
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Resolve PR comparison range
        id: range
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          test -n "$merge_base"
          git merge-base --is-ancestor "$merge_base" "$BASE_SHA"
          git merge-base --is-ancestor "$merge_base" "$HEAD_SHA"
          echo "MERGE_BASE=$merge_base" >> "$GITHUB_ENV"
      - name: Validate changed skill version bumps
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.range.outcome == 'success' }}
        run: pnpm tsx scripts/validate-skill-versions.ts --base-ref "$MERGE_BASE"
      - name: Validate .agents/skills internal flags
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run validate:internal-flags
      - name: Lint PR commits (Conventional Commits)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.range.outcome == 'success' }}
        run: >-
          pnpm exec commitlint
          --from "$MERGE_BASE"
          --to "$HEAD_SHA"
          --verbose
      - name: Capture generated output paths
        id: generated
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm tsx scripts/build-generated.ts --list-outputs > "$RUNNER_TEMP/generated-output-paths.txt"
      - name: oxlint (changed authored source)
        if: ${{ !cancelled() && steps.range.outcome == 'success' && steps.generated.outcome == 'success' }}
        run: |
          # Write the diff first so a git failure cannot disappear in a read loop.
          git diff --name-only -z --diff-filter=ACMR "$MERGE_BASE" "$HEAD_SHA" -- '*.ts' '*.mts' '*.mjs' '*.js' > "$RUNNER_TEMP/lint-files"
          files=()
          while IFS= read -r -d '' file; do
            case "$file" in
              node_modules/*|.oat/*|.agents/*|\
              .claude/skills/*|.cursor/skills/*|\
              .claude/rules/*|.cursor/rules/*|\
              AGENTS.md|*/AGENTS.md)
                continue
                ;;
            esac
            generated=false
            while IFS= read -r root; do
              if [[ "$file" == "$root" || "$file" == "$root/"* ]]; then
                generated=true
                break
              fi
            done < "$RUNNER_TEMP/generated-output-paths.txt"
            if $generated; then
              continue
            fi
            files+=("$file")
          done < "$RUNNER_TEMP/lint-files"
          if [ ${#files[@]} -eq 0 ]; then
            echo "no authored source changed"
            exit 0
          fi
          printf 'linting: %q\n' "${files[@]}"
          pnpm exec oxlint -- "${files[@]}"
      - name: oxfmt --check (changed files)
        if: ${{ !cancelled() && steps.range.outcome == 'success' && steps.generated.outcome == 'success' }}
        run: |
          # Keep filenames NUL-delimited, including spaces, newlines and glob characters.
          git diff --name-only -z --diff-filter=ACMR "$MERGE_BASE" "$HEAD_SHA" -- '*.ts' '*.mts' '*.mjs' '*.js' '*.json' '*.md' > "$RUNNER_TEMP/format-files"
          files=()
          while IFS= read -r -d '' file; do
            case "$file" in
              node_modules/*|.oat/*|.agents/*|\
              .claude/skills/*|.cursor/skills/*|\
              .claude/rules/*|.cursor/rules/*|\
              AGENTS.md|*/AGENTS.md)
                continue
                ;;
            esac
            generated=false
            while IFS= read -r root; do
              if [[ "$file" == "$root" || "$file" == "$root/"* ]]; then
                generated=true
                break
              fi
            done < "$RUNNER_TEMP/generated-output-paths.txt"
            if $generated; then
              continue
            fi
            files+=("$file")
          done < "$RUNNER_TEMP/format-files"
          if [ ${#files[@]} -eq 0 ]; then
            echo "no formattable files changed"
            exit 0
          fi
          printf 'checking format: %q\n' "${files[@]}"
          pnpm exec oxfmt --check -- "${files[@]}"
