name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches:
      - main

permissions:
  contents: read

# Rapid successive pushes/PR updates should cancel the stale six-job matrix
# instead of queueing duplicates.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GIT_HOOKS: "0" # skip git-hook setup in CI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture generated output paths
        run: pnpm tsx scripts/build-generated.ts --list-outputs > "$RUNNER_TEMP/generated-output-paths.txt"
      - name: Verify committed generated outputs before tests
        run: pnpm run build:check
      - run: pnpm run type-check
      - run: pnpm run test
      - run: pnpm run validate
      - run: pnpm run smoke

  skill-versions:
    # Require a version bump for any skill whose directory changed in the PR.
    # Needs full history (fetch-depth: 0) to diff against the PR base.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve PR comparison range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          test -n "$merge_base"
          echo "MERGE_BASE=$merge_base" >> "$GITHUB_ENV"
      - name: Validate changed skill version bumps
        run: pnpm tsx scripts/validate-skill-versions.ts --base-ref "$MERGE_BASE"

  internal-flags:
    # Block merge if any .agents/skills/**/SKILL.md is missing
    # metadata.internal: true — the flag that hides OAT tooling skills from
    # `npx skills` discovery. Modeled on the skill-versions gate; PR-scoped. The
    # detector scans the synced skills tree, so no base diff / full history is
    # needed.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate .agents/skills internal flags
        run: pnpm run validate:internal-flags

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve PR comparison range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          test -n "$merge_base"
          echo "MERGE_BASE=$merge_base" >> "$GITHUB_ENV"
      - name: Lint PR commits (Conventional Commits)
        run: >-
          pnpm exec commitlint
          --from "$MERGE_BASE"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose

  lint:
    # Lint/format only the files changed by the PR. The repo is being formatted
    # incrementally, so a whole-repo check would fail on the un-migrated backlog.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      GIT_HOOKS: "0"
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve PR comparison range and generated roots
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          test -n "$merge_base"
          echo "MERGE_BASE=$merge_base" >> "$GITHUB_ENV"
          pnpm tsx scripts/build-generated.ts --list-outputs > "$RUNNER_TEMP/generated-output-paths.txt"
      - name: oxlint (changed authored source)
        run: |
          exclude='^(node_modules|\.oat|\.agents)/'
          files=()
          while IFS= read -r file; do
            generated=false
            while IFS= read -r root; do
              if [[ "$file" == "$root" || "$file" == "$root/"* ]]; then generated=true; break; fi
            done < "$RUNNER_TEMP/generated-output-paths.txt"
            $generated && continue
            files+=("$file")
          done < <(git diff --name-only --diff-filter=ACMR "$MERGE_BASE" "$HEAD_SHA" -- '*.ts' '*.mts' '*.mjs' '*.js' | grep -vE "$exclude" || true)
          if [ ${#files[@]} -eq 0 ]; then echo "no authored source changed"; exit 0; fi
          printf 'linting:\n%s\n' "${files[*]}"
          pnpm exec oxlint "${files[@]}"
      - name: oxfmt --check (changed files)
        run: |
          exclude='^(node_modules|\.oat|\.agents)/|\.(claude|cursor)/rules/|(^|/)(AGENTS|CLAUDE)\.md$'
          files=()
          while IFS= read -r file; do
            generated=false
            while IFS= read -r root; do
              if [[ "$file" == "$root" || "$file" == "$root/"* ]]; then generated=true; break; fi
            done < "$RUNNER_TEMP/generated-output-paths.txt"
            $generated && continue
            files+=("$file")
          done < <(git diff --name-only --diff-filter=ACMR "$MERGE_BASE" "$HEAD_SHA" -- '*.ts' '*.mts' '*.mjs' '*.js' '*.json' '*.md' | grep -vE "$exclude" || true)
          if [ ${#files[@]} -eq 0 ]; then echo "no formattable files changed"; exit 0; fi
          printf 'checking format:\n%s\n' "${files[*]}"
          pnpm exec oxfmt --check "${files[@]}"
