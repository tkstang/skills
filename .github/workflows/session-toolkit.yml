name: Session Toolkit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: session-toolkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check
      - run: pnpm run build:toolkit
      - run: pnpm run test:vitest tests/release/session-toolkit-cli.test.ts tests/release/session-toolkit-package.test.ts
      - name: Prepare and inspect one archive without publishing
        run: pnpm run release:toolkit:dry-run --out "$RUNNER_TEMP/session-toolkit"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: session-toolkit-archive
          path: ${{ runner.temp }}/session-toolkit/
          if-no-files-found: error

  consumer:
    needs: archive
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.0.0", "24"]
    env:
      GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: session-toolkit-archive
          path: ${{ runner.temp }}/session-toolkit/
      - name: Verify identity and install the same archive on the consumer runtime
        run: |
          cd "$RUNNER_TEMP/session-toolkit"
          sha256sum -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          pnpm run toolkit:pack:check --archive "$RUNNER_TEMP"/session-toolkit/*.tgz
