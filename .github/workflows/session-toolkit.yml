name: Session Toolkit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
    tags: [session-toolkit-v*]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing session-toolkit-vX.Y.Z tag to validate and retry
        type: string
        required: true

permissions:
  contents: read

# Ready PR replacements share a group. Drafts and ignored edits stay isolated
# from pending checks; ignored edits also use separate check names.
concurrency:
  group: >-
    session-toolkit-${{ inputs.release_tag || github.ref }}${{
    github.event_name == 'pull_request' &&
    (github.event.pull_request.draft ||
    (github.event.action == 'edited' && !github.event.changes.base.ref)) &&
    format('-ignored-{0}', github.run_id) ||
    ''
    }}
  cancel-in-progress: >-
    ${{
    github.event_name == 'pull_request' &&
    !github.event.pull_request.draft &&
    (github.event.action != 'edited' || github.event.changes.base.ref != null)
    }}

jobs:
  archive:
    name: >-
      ${{
      github.event.action == 'edited' &&
      !github.event.changes.base.ref &&
      'Ignored PR edit (archive)' ||
      'archive'
      }}
    if: >-
      ${{
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
      (github.event.action != 'edited' || github.event.changes.base.ref))
      }}
    runs-on: ubuntu-latest
    outputs:
      # The selector gates archive checks here and installed-consumer checks below.
      relevant: ${{ steps.changes.outputs.relevant }}
    env:
      GIT_HOOKS: "0"
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
      - name: Select archive and installed-consumer checks from PR inputs
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # relevant=true runs archive and installed-consumer checks; false skips them.
          # Main, package tags and manual release retries always run everything.
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for revision in "$PR_BASE_SHA" "$PR_HEAD_SHA"; do
            if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'Invalid PR revision' >&2
              exit 1
            fi
            git cat-file -e "$revision^{commit}"
          done
          comparison="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          changed="$(mktemp)"
          trap 'rm -f "$changed"' EXIT
          # Disable rename detection so both old and new paths are classified.
          git diff --name-only --no-renames -z "$comparison" "$PR_HEAD_SHA" > "$changed"
          relevant=false
          while IFS= read -r -d '' path; do
            case "$path" in
              README.md|CONTRIBUTING.md|AGENTS.md|documentation/*|.oat/repo/*.md) ;;
              *)
                relevant=true
                ;;
            esac
          done < "$changed"
          # Source, tests, package metadata, runtime/toolchain/lock/workflow and
          # any unknown input run the full archive and installed-consumer proof.
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changes.outputs.relevant == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: "24"
          cache: pnpm
      - name: Install archive verification dependencies
        run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.relevant == 'true'
      - name: Type check repository and Session Toolkit
        run: pnpm run type-check
        if: steps.changes.outputs.relevant == 'true'
      - name: Verify committed generated outputs
        run: pnpm run build:check
        if: steps.changes.outputs.relevant == 'true'
      - name: Build Session Toolkit
        run: pnpm run build:toolkit
        if: steps.changes.outputs.relevant == 'true'
      - name: Test Session Toolkit archive contracts
        run: pnpm run test:vitest tests/release/session-toolkit-*.test.ts
        if: steps.changes.outputs.relevant == 'true'
      - name: Pack current source for pull requests and main
        if: >-
          ${{
          steps.changes.outputs.relevant == 'true' &&
          !startsWith(github.ref, 'refs/tags/session-toolkit-v') &&
          github.event_name != 'workflow_dispatch'
          }}
        run: |
          mkdir "$RUNNER_TEMP/session-toolkit"
          pnpm --dir packages/session-toolkit pack --pack-destination "$RUNNER_TEMP/session-toolkit"
          pnpm run toolkit:pack:check --archive "$RUNNER_TEMP"/session-toolkit/*.tgz
      - name: Prepare one clean source-bound release archive without publishing
        if: startsWith(github.ref, 'refs/tags/session-toolkit-v') || github.event_name == 'workflow_dispatch'
        run: pnpm run release:toolkit:prepare --out "$RUNNER_TEMP/session-toolkit"
      - name: Bind release invocations to the actual requested tag
        if: startsWith(github.ref, 'refs/tags/session-toolkit-v') || github.event_name == 'workflow_dispatch'
        run: pnpm run release:toolkit:verify --directory "$RUNNER_TEMP/session-toolkit" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.changes.outputs.relevant == 'true'
        with:
          name: session-toolkit-archive
          path: ${{ runner.temp }}/session-toolkit/
          if-no-files-found: error

  consumer:
    name: >-
      ${{
      github.event.action == 'edited' &&
      !github.event.changes.base.ref &&
      'Ignored PR edit (consumer)' ||
      'consumer'
      }} (${{ matrix.node }})
    if: >-
      ${{
      needs.archive.outputs.relevant == 'true' &&
      (github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
      (github.event.action != 'edited' || github.event.changes.base.ref)))
      }}
    needs: archive
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.0.0", "24"]
    env:
      GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: session-toolkit-archive
          path: ${{ runner.temp }}/session-toolkit/
      - name: Validate and install the same downloaded archive on the consumer runtime
        if: >-
          ${{
          !startsWith(github.ref, 'refs/tags/session-toolkit-v') &&
          github.event_name != 'workflow_dispatch'
          }}
        run: pnpm run toolkit:pack:check --archive "$RUNNER_TEMP"/session-toolkit/*.tgz
      - name: Verify the source-bound release on the consumer runtime
        if: startsWith(github.ref, 'refs/tags/session-toolkit-v') || github.event_name == 'workflow_dispatch'
        run: pnpm run release:toolkit:verify --directory "$RUNNER_TEMP/session-toolkit"

  publish:
    needs: [archive, consumer]
    if: vars.SESSION_TOOLKIT_RELEASE_ENABLED == 'true' && (startsWith(github.ref, 'refs/tags/session-toolkit-v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      GIT_HOOKS: "0"
      SESSION_TOOLKIT_RELEASE_ENABLED: ${{ vars.SESSION_TOOLKIT_RELEASE_ENABLED }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use an npm runtime with trusted-publishing support
        run: npm install --global npm@11.20.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: session-toolkit-archive
          path: ${{ runner.temp }}/session-toolkit/
      - name: Publish the validated archive, or verify matching registry integrity on retry
        run: pnpm run release:toolkit:publish --directory "$RUNNER_TEMP/session-toolkit" --tag "$RELEASE_TAG"
