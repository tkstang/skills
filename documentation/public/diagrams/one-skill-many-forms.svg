<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 740" role="img" aria-labelledby="osmfTitle osmfDesc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="osmfTitle">One skill, every installation form</title>
  <desc id="osmfDesc">A skill authored once under src/skills/session-retro, together with its entry in src/distributions.ts, is emitted by pnpm run build into a standalone form under skills/session-retro and a Session plugin member under plugins/session/skills/retro. Both generated forms reach one provider install path, which Claude Code, Codex, and Cursor load with no install step. pnpm run build:check compares the committed forms back against the source and declarations. Provider manifests and marketplace catalogs are release-owned and feed the installed row from outside the build.</desc>
  <style>
    .card{fill:var(--diagram-card,#ffffff);stroke:var(--diagram-line,#757575);stroke-width:1.2}
    .band{fill:none;stroke:var(--diagram-line,#757575);stroke-width:1.2;stroke-dasharray:5 5;opacity:.5}
    .h{fill:var(--diagram-muted,#757575);font-size:13px;font-weight:700;letter-spacing:1.4px}
    .t{fill:var(--diagram-text,#111827);font-size:17px;font-weight:600}
    .s{fill:var(--diagram-text,#111827);font-size:15px;opacity:.9}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;fill:var(--diagram-text,#111827)}
    .p{fill:var(--diagram-muted,#757575);font-size:14px}
    .e{fill:none;stroke:var(--diagram-line,#757575);stroke-width:1.6;marker-end:url(#osmfArrow)}
    .bus{fill:none;stroke:var(--diagram-line,#757575);stroke-width:1.6}
    .ed{fill:none;stroke:var(--diagram-line,#757575);stroke-width:1.4;stroke-dasharray:6 5;marker-end:url(#osmfArrow)}
    .acc1{fill:var(--diagram-accent,#0f8f95)}
    .acc2{fill:var(--diagram-accent-2,#7c5cbf)}
    .warncard{fill:var(--diagram-card,#ffffff);stroke:var(--diagram-warn,#b9741f);stroke-width:1.4;stroke-dasharray:6 5}
    .warnt{fill:var(--diagram-warn,#b9741f);font-size:13px;font-weight:700;letter-spacing:1.2px}
  </style>
  <defs>
    <marker id="osmfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--diagram-line,#757575)"/>
    </marker>
  </defs>

  <text x="415" y="36" text-anchor="middle" class="h" style="font-size:20px">ONE SKILL, EVERY INSTALLATION FORM</text>
  <text x="415" y="60" text-anchor="middle" class="p">Authored once, generated by the build, declared for each provider</text>

  <!-- row 1: authored -->
  <rect x="24" y="82" width="782" height="122" rx="8" class="band"/>
  <text x="40" y="104" class="h">AUTHORED ONCE</text>
  <rect x="40" y="114" width="372" height="76" rx="6" class="card"/>
  <text x="58" y="142" class="m">src/skills/session-retro/</text>
  <text x="58" y="168" class="s">SKILL.md + assets</text>
  <rect x="434" y="114" width="356" height="76" rx="6" class="card"/>
  <text x="452" y="142" class="m">src/distributions.ts</text>
  <text x="452" y="168" class="s">declares the forms</text>

  <!-- build:check return (drawn first, under the build card) -->
  <path class="ed" d="M40,382 L16,382 L16,264 L310,264"/>
  <rect x="52" y="252" width="196" height="24" rx="4" class="card"/>
  <text x="150" y="269" text-anchor="middle" class="m">pnpm run build:check</text>

  <path class="e" d="M226,192 L226,222"/>
  <path class="e" d="M612,192 C612,210 460,206 460,222"/>

  <!-- build -->
  <rect x="312" y="224" width="206" height="72" rx="6" class="card"/>
  <text x="415" y="252" text-anchor="middle" class="m">pnpm run build</text>
  <text x="415" y="276" text-anchor="middle" class="s">emits every declared form</text>

  <path class="e" d="M415,298 L415,322"/>

  <!-- row 2: generated forms -->
  <rect x="24" y="324" width="782" height="130" rx="8" class="band"/>
  <text x="40" y="346" class="h">GENERATED FORMS · COMMITTED</text>
  <rect x="40" y="356" width="372" height="82" rx="6" class="card"/>
  <rect x="40" y="356" width="6" height="82" rx="3" class="acc1"/>
  <text x="62" y="386" class="m">skills/session-retro/</text>
  <text x="62" y="412" class="s">standalone skill</text>
  <rect x="434" y="356" width="356" height="82" rx="6" class="card"/>
  <rect x="434" y="356" width="6" height="82" rx="3" class="acc2"/>
  <text x="456" y="386" class="m" style="font-size:13px">plugins/session/skills/retro/</text>
  <text x="456" y="412" class="s">Session plugin member</text>

  <!-- install bus -->
  <path class="bus" d="M226,440 L226,486"/>
  <path class="bus" d="M612,440 L612,486"/>
  <path class="bus" d="M150,486 L690,486"/>
  <path class="e" d="M150,486 L150,524"/>
  <path class="e" d="M415,486 L415,524"/>
  <path class="e" d="M690,486 L690,524"/>
  <text x="415" y="478" text-anchor="middle" class="p">declared targets — no install step</text>

  <!-- row 3: installed -->
  <text x="40" y="542" class="h">DECLARED</text>
  <text x="40" y="562" class="h">TARGETS</text>
  <rect x="150" y="526" width="180" height="52" rx="6" class="card"/>
  <text x="240" y="558" text-anchor="middle" class="t">Claude Code</text>
  <rect x="345" y="526" width="140" height="52" rx="6" class="card"/>
  <text x="415" y="558" text-anchor="middle" class="t">Codex</text>
  <rect x="600" y="526" width="180" height="52" rx="6" class="card"/>
  <text x="690" y="558" text-anchor="middle" class="t">Cursor</text>

  <!-- release-owned -->
  <path class="ed" d="M462,634 L545,634 L545,492"/>
  <rect x="40" y="602" width="420" height="88" rx="6" class="warncard"/>
  <text x="58" y="626" class="warnt">RELEASE-OWNED · NOT GENERATED</text>
  <text x="58" y="652" class="s">Provider manifests and marketplace catalogs</text>
  <text x="58" y="674" class="s">register and publish a plugin; the build never does</text>

  <text x="415" y="722" text-anchor="middle" class="p">Rename on purpose: standalone <tspan class="m" style="fill:var(--diagram-muted,#757575)">session-retro</tspan>, plugin member <tspan class="m" style="fill:var(--diagram-muted,#757575)">retro</tspan>.</text>
</svg>
